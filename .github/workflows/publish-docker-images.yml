name: Publish Docker images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
            image: ghcr.io/johnthebelovedcoder/perfectfit-api
            package_slug: perfectfit-api
            app_dir: api
            package_name: "@thread/api"
            port: 3001
          - name: storefront
            dockerfile: Dockerfile.next
            image: ghcr.io/johnthebelovedcoder/perfectfit-storefront
            package_slug: perfectfit-storefront
            app_dir: storefront
            package_name: "@thread/storefront"
            port: 3000
          - name: seller
            dockerfile: Dockerfile.next
            image: ghcr.io/johnthebelovedcoder/perfectfit-seller
            package_slug: perfectfit-seller
            app_dir: seller
            package_name: "@thread/seller"
            port: 3002
          - name: admin
            dockerfile: Dockerfile.next
            image: ghcr.io/johnthebelovedcoder/perfectfit-admin
            package_slug: perfectfit-admin
            app_dir: admin
            package_name: "@thread/admin"
            port: 3003

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ github.sha }}
          # NEXT_PUBLIC_* are inlined into the browser bundle at BUILD time, so
          # NEXT_PUBLIC_API_URL must be the PUBLIC API URL the browser can reach
          # (NOT the internal http://api:3001). Set repo variables under
          # Settings → Secrets and variables → Actions → Variables.
          build-args: |
            PACKAGE_NAME=${{ matrix.package_name }}
            APP_DIR=${{ matrix.app_dir }}
            PORT=${{ matrix.port }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:3001' }}
            NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME=${{ vars.NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME || 'dbzbeaxfm' }}
            NEXT_PUBLIC_SELLER_URL=${{ vars.NEXT_PUBLIC_SELLER_URL || 'https://seller.perfectfithq.com' }}
            NEXT_PUBLIC_ADMIN_URL=${{ vars.NEXT_PUBLIC_ADMIN_URL || 'https://admin.perfectfithq.com' }}
            NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}

      # Best-effort: the default GITHUB_TOKEN often can't change package
      # visibility (returns 403). Don't fail the run over it — set the package
      # to public once in the GitHub UI (Packages → package → Settings) instead.
      - name: Make package public (best-effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH \
            -H "Accept: application/vnd.github+json" \
            /user/packages/container/${{ matrix.package_slug }} \
            -f visibility=public || echo "Could not set visibility; set it manually in the GitHub UI."
