      NODE_ENV: production
      PORT: 3003
      NEXT_PUBLIC_API_URL: https://perfectfit-api-hive.onrender.com
      NEXT_PUBLIC_CLOUDINARY_CLOUD_NAME: dbzbeaxfm

volumes:
  postgres-data:
