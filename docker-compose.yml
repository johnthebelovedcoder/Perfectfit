# All secrets/config come from a `.env` file placed next to this compose file on
# the server (see .env.hostinger.example). Nothing sensitive is committed here.
#
#   cp .env.hostinger.example .env   # then fill in real values
#   docker compose up -d
#
# DATABASE_URL defaults to the bundled `postgres` service below. To use an
# external DB (e.g. Neon), set DATABASE_URL/DIRECT_URL in .env and you can
# ignore the postgres service.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-perfectfit}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Auto-deploy: every 2 minutes Watchtower checks the registry and, when a
  # service's :latest image has changed (i.e. after the GitHub Actions build
  # finishes), pulls it and recreates that container. --cleanup removes old images.
  watchtower:
    image: containrrr/watchtower
    restart: unless-stopped
    environment:
      # containrrr/watchtower ships an old Docker client; pin the API version so
      # it can talk to a modern daemon (avoids "client version 1.25 is too old").
      DOCKER_API_VERSION: "1.44"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 120 --cleanup

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - storefront
      - seller
      - admin
      - api

  api:
    image: ghcr.io/johnthebelovedcoder/perfectfit-api:latest
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/perfectfit}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/perfectfit}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET}
      CLOUDINARY_UPLOAD_PRESET: ${CLOUDINARY_UPLOAD_PRESET:-ml_default}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM:-}
      THREAD_WAREHOUSE_ADDRESS: ${THREAD_WAREHOUSE_ADDRESS:-1 Warehouse Way, Tulsa, Oklahoma}
      THREAD_WAREHOUSE_CONTACT_NUMBER: ${THREAD_WAREHOUSE_CONTACT_NUMBER:-+1 (973) 282-6945}
      NEXT_PUBLIC_STOREFRONT_URL: ${NEXT_PUBLIC_STOREFRONT_URL:-http://localhost:3000}
      NEXT_PUBLIC_SELLER_URL: ${NEXT_PUBLIC_SELLER_URL:-http://localhost:3002}
      NEXT_PUBLIC_ADMIN_URL: ${NEXT_PUBLIC_ADMIN_URL:-http://localhost:3003}
    command: sh -c "pnpm --filter @thread/database exec prisma db push && node dist/main"

  storefront:
    image: ghcr.io/johnthebelovedcoder/perfectfit-storefront:latest
    pull_policy: always
    depends_on:
      - api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000

  seller:
    image: ghcr.io/johnthebelovedcoder/perfectfit-seller:latest
    pull_policy: always
    depends_on:
      - api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002

  admin:
    image: ghcr.io/johnthebelovedcoder/perfectfit-admin:latest
    pull_policy: always
    depends_on:
      - api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3003

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
